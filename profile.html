<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Your thashowbook profile"
    >

    <title>Profile | thashowbook</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="header-container">

        <!-- LOGO -->
        <a
            href="index.html"
            class="brand"
        >
            <img
                src="images/logo/logo.png"
                alt="thashowbook"
                class="brand-logo"
            >
        </a>


        <!-- NAVIGATION -->
        <nav
            class="main-navigation"
            aria-label="Main navigation"
        >

            <a
                href="index.html"
                class="active"
            >
                Home
            </a>

            <a
                href="movies.html"
            >
                Movies
            </a>

            <a
                href="bookings.html"
            >
                My Bookings
            </a>

            <!-- ABOUT -->
            <a
                href="about.html"
            >
                About
            </a>

        </nav>


        <!-- HEADER ACTION -->
        <div class="header-actions">

            <a
                href="login.html"
                class="login-button"
            >
                Login
            </a>

        </div>

    </div>

</header>



    <!-- =====================================================
         PROFILE MAIN
         ===================================================== -->

    <main class="profile-page">


        <section class="profile-section">


            <div class="profile-container">


                <!-- PAGE HEADING -->

                <div class="profile-heading">

                    <p class="profile-eyebrow">
                        MY ACCOUNT
                    </p>

                    <h1>
                        Profile
                    </h1>

                    <p>
                        Manage your thashowbook account.
                    </p>

                </div>



                <!-- PROFILE CARD -->

                <div class="profile-card">


                    <div class="profile-card-header">

                        <div class="profile-avatar">

                            <span id="profileAvatar">
                                T
                            </span>

                        </div>


                        <div class="profile-user-info">

                            <h2 id="profileName">
                                thashowbook User
                            </h2>

                            <p id="profileEmail">
                                —
                            </p>

                        </div>

                    </div>



                    <!-- ACCOUNT INFORMATION -->

                    <div class="profile-details">


                        <div class="profile-detail-row">

                            <div class="profile-detail-label">

                                <span>
                                    Name
                                </span>

                            </div>


                            <div
                                class="profile-detail-value"
                                id="profileNameRow"
                            >
                                —
                            </div>

                        </div>



                        <div class="profile-detail-row">

                            <div class="profile-detail-label">

                                <span>
                                    Email
                                </span>

                            </div>


                            <div
                                class="profile-detail-value"
                                id="profileEmailRow"
                            >
                                —
                            </div>

                        </div>


                    </div>



                    <!-- PROFILE ACTIONS -->

                    <div class="profile-actions">


                        <a
                            href="bookings.html"
                            class="profile-action-button"
                        >
                            My Bookings
                        </a>


                        <a
                            href="movies.html"
                            class="profile-action-button secondary"
                        >
                            Browse Movies
                        </a>


                        <button
                            type="button"
                            id="logoutButton"
                            class="profile-logout-button"
                        >
                            Logout
                        </button>


                    </div>


                </div>


            </div>


        </section>


    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">


        <div class="footer-container">


            <div class="footer-brand">

                <img
                    src="images/logo/logo.png"
                    alt="thashowbook"
                >

            </div>


            <div class="footer-links">


                <div class="footer-column">

                    <h3>
                        thashowbook
                    </h3>

                    <a href="index.html">
                        Home
                    </a>

                    <a href="movies.html">
                        Movies
                    </a>

                    <a href="bookings.html">
                        My Bookings
                    </a>

                </div>


                <div class="footer-column">

                    <h3>
                        Account
                    </h3>

                    <a href="profile.html">
                        Profile
                    </a>

                    <a href="login.html">
                        Login
                    </a>

                </div>


            </div>


        </div>


        <div class="footer-bottom">

            <p>
                © 2026 thashowbook. All rights reserved.
            </p>

            <p>
                Pick. Book. Watch.
            </p>

        </div>


    </footer>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="js/script.js"
    ></script>


</body>

</html>
